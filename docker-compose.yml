version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustbridge-postgres
    environment:
      POSTGRES_USER: trustbridge
      POSTGRES_PASSWORD: trustbridge-dev-password
      POSTGRES_DB: trustbridge_dashboard
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U trustbridge -d trustbridge_dashboard
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustbridge-network

  postgres-admin:
    image: adminer:4-standalone
    container_name: trustbridge-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - trustbridge-network

volumes:
  postgres_data:

networks:
  trustbridge-network:
    driver: bridge
